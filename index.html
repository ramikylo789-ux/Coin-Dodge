<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coin Dodge</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px;
}

#info {
    font-size: 22px;
    margin: 10px;
}

#shield {
    height: 25px;
    font-size: 18px;
}

#game {
    width: 90vw;
    max-width: 700px;
    height: 450px;

    margin: 15px auto;

    background: #222;

    border: 3px solid white;

    position: relative;

    overflow: hidden;
}

#player {
    width: 30px;
    height: 30px;

    background: #3498db;

    position: absolute;

    left: 335px;
    top: 210px;

    border-radius: 5px;
}

#coin {
    width: 22px;
    height: 22px;

    background: gold;

    border-radius: 50%;

    position: absolute;
}

.enemy {
    width: 30px;
    height: 30px;

    background: red;

    position: absolute;

    border-radius: 5px;
}

button {
    padding: 12px 22px;

    margin: 5px;

    border: none;

    border-radius: 10px;

    font-size: 17px;

    cursor: pointer;
}

#start {
    background: white;
    color: black;
}

#home {
    background: #444;
    color: white;
}

#gameOver {
    display: none;

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: rgba(0,0,0,0.95);

    padding: 30px;

    border-radius: 15px;

    z-index: 20;
}

</style>
</head>

<body>

<h1>🪙 Coin Dodge</h1>

<div id="info">
Punkte: 0 | Leben: ❤️❤️❤️
</div>

<div id="shield"></div>

<button id="start" onclick="startGame()">
▶️ Start
</button>

<button id="home" onclick="location.href='../'">
🏠 Startseite
</button>

<div id="game">

    <div id="player"></div>

    <div id="coin"></div>

    <div id="gameOver">

        <h2>💀 GAME OVER</h2>

        <p id="finalScore"></p>

        <button onclick="startGame()">
            🔄 Nochmal
        </button>

    </div>

</div>


<script>

/* =========================
   SPIEL-VARIABLEN
========================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const coin =
    document.getElementById("coin");

const info =
    document.getElementById("info");

const shield =
    document.getElementById("shield");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");


let playerX = 335;

let playerY = 210;

let score = 0;

let lives = 3;

let gameRunning = false;


/*
   DAS IST DER COOLDOWN
   false = verwundbar
   true = unverwundbar
*/

let invincible = false;


let keys = {};

let enemies = [];

let cooldownTimer = null;

let blinkTimer = null;


/* =========================
   TASTATUR
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);


/* =========================
   ZUFÄLLIGE POSITION
========================= */

function randomPosition(size) {

    return {

        x:
            Math.random() *
            (game.clientWidth - size),

        y:
            Math.random() *
            (game.clientHeight - size)

    };

}


/* =========================
   COIN
========================= */

function moveCoin() {

    let position =
        randomPosition(22);

    coin.style.left =
        position.x + "px";

    coin.style.top =
        position.y + "px";

}


/* =========================
   GEGNER
========================= */

function createEnemies() {

    enemies.forEach(function(enemy) {

        enemy.element.remove();

    });


    enemies = [];


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        let enemy =
            document.createElement("div");

        enemy.className =
            "enemy";


        let position =
            randomPosition(30);


        enemies.push({

            element: enemy,

            x: position.x,

            y: position.y,

            dx:
                Math.random() < 0.5
                ? 2
                : -2,

            dy:
                Math.random() < 0.5
                ? 2
                : -2

        });


        enemy.style.left =
            position.x + "px";

        enemy.style.top =
            position.y + "px";


        game.appendChild(enemy);

    }

}


/* =========================
   SPIEL STARTEN
========================= */

function startGame() {

    /*
       Alte Timer löschen
    */

    clearTimeout(cooldownTimer);

    clearInterval(blinkTimer);


    score = 0;

    lives = 3;

    gameRunning = true;

    invincible = false;


    playerX = 335;

    playerY = 210;


    player.style.display =
        "block";

    player.style.opacity =
        "1";


    gameOver.style.display =
        "none";


    shield.textContent =
        "";


    updateInfo();

    moveCoin();

    createEnemies();


    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =========================
   SPIELER BEWEGEN
========================= */

function movePlayer() {

    if (!gameRunning) {
        return;
    }


    const speed = 4;


    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        playerY -= speed;

    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        playerY += speed;

    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        playerX -= speed;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        playerX += speed;

    }


    /* Grenzen */

    playerX =
        Math.max(
            0,
            Math.min(
                game.clientWidth - 30,
                playerX
            )
        );


    playerY =
        Math.max(
            0,
            Math.min(
                game.clientHeight - 30,
                playerY
            )
        );


    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =========================
   GEGNER BEWEGEN
========================= */

function moveEnemies() {

    if (!gameRunning) {
        return;
    }


    enemies.forEach(function(enemy) {

        enemy.x += enemy.dx;

        enemy.y += enemy.dy;


        if (
            enemy.x <= 0 ||
            enemy.x >=
            game.clientWidth - 30
        ) {

            enemy.dx *= -1;

        }


        if (
            enemy.y <= 0 ||
            enemy.y >=
            game.clientHeight - 30
        ) {

            enemy.dy *= -1;

        }


        enemy.element.style.left =
            enemy.x + "px";

        enemy.element.style.top =
            enemy.y + "px";

    });

}


/* =========================
   KOLLISION
========================= */

function collision(
    ax,
    ay,
    aw,
    ah,
    bx,
    by,
    bw,
    bh
) {

    return (

        ax < bx + bw &&

        ax + aw > bx &&

        ay < by + bh &&

        ay + ah > by

    );

}


/* =========================
   COIN PRÜFEN
========================= */

function checkCoin() {

    let coinX =
        parseFloat(
            coin.style.left
        );

    let coinY =
        parseFloat(
            coin.style.top
        );


    if (

        collision(

            playerX,
            playerY,
            30,
            30,

            coinX,
            coinY,
            22,
            22

        )

    ) {

        score += 10;

        moveCoin();

        updateInfo();

    }

}


/* =========================
   GEGNER PRÜFEN
========================= */

function checkEnemies() {

    /*
       SEHR WICHTIG:

       Wenn invincible true ist,
       wird die Funktion SOFORT beendet.
    */

    if (invincible) {

        return;

    }


    for (
        let enemy of enemies
    ) {

        let hit =
            collision(

                playerX,
                playerY,
                30,
                30,

                enemy.x,
                enemy.y,
                30,
                30

            );


        if (hit) {

            loseLife();

            return;

        }

    }

}


/* =========================
   LEBEN VERLIEREN
========================= */

function loseLife() {

    /*
       Doppelte Treffer verhindern
    */

    if (invincible) {

        return;

    }


    lives--;


    updateInfo();


    /*
       Keine Leben mehr
    */

    if (lives <= 0) {

        endGame();

        return;

    }


    /*
       🛡️ COOLDOWN START
    */

    invincible = true;


    let cooldown =
        1500;


    shield.textContent =
        "🛡️ UNVERWUNDBAR";


    /*
       Spieler blinken lassen
    */

    blinkTimer =
        setInterval(function() {

            if (
                player.style.opacity === "1"
            ) {

                player.style.opacity =
                    "0.25";

            } else {

                player.style.opacity =
                    "1";

            }

        }, 100);


    /*
       Spieler an sichere Stelle setzen
    */

    movePlayerToSafePosition();


    /*
       Nach 1,5 Sekunden
       wieder verwundbar
    */

    cooldownTimer =
        setTimeout(function() {

            invincible = false;


            clearInterval(
                blinkTimer
            );


            player.style.opacity =
                "1";


            shield.textContent =
                "";

        }, cooldown);

}


/* =========================
   SICHERE POSITION
========================= */

function movePlayerToSafePosition() {

    let position;

    let safe = false;


    while (!safe) {

        position =
            randomPosition(30);


        safe = true;


        /*
           Prüfen, ob dort
           ein Gegner ist
        */

        for (
            let enemy of enemies
        ) {

            if (

                collision(

                    position.x,
                    position.y,
                    30,
                    30,

                    enemy.x,
                    enemy.y,
                    30,
                    30

                )

            ) {

                safe = false;

                break;

            }

        }

    }


    playerX =
        position.x;

    playerY =
        position.y;


    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =========================
   ANZEIGE
========================= */

function updateInfo() {

    info.textContent =
        "Punkte: " +
        score +
        " | Leben: " +
        "❤️".repeat(lives);

}


/* =========================
   GAME OVER
========================= */

function endGame() {

    gameRunning = false;

    invincible = false;


    clearTimeout(
        cooldownTimer
    );

    clearInterval(
        blinkTimer
    );


    player.style.opacity =
        "1";


    player.style.display =
        "none";


    shield.textContent =
        "";


    finalScore.textContent =
        "Du hast " +
        score +
        " Punkte erreicht!";


    gameOver.style.display =
        "block";

}


/* =========================
   SPIELSCHLEIFE
========================= */

function gameLoop() {

    movePlayer();

    moveEnemies();

    checkCoin();

    checkEnemies();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   STARTZUSTAND
========================= */

player.style.display =
    "none";


coin.style.display =
    "block";


gameLoop();

</script>

</body>
</html>

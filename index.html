<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🪙 Coin Dodge</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px 0 10px;
}

#info {
    font-size: 20px;
    margin-bottom: 5px;
}

#cooldown {
    height: 25px;
    font-size: 18px;
}

#game {
    width: 90vw;
    max-width: 700px;
    height: 450px;

    margin: 15px auto;

    background: #222;

    border: 3px solid white;

    position: relative;

    overflow: hidden;
}

#player {
    width: 30px;
    height: 30px;

    background: #3498db;

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);
}

#coin {
    width: 22px;
    height: 22px;

    background: gold;

    border-radius: 50%;

    position: absolute;
}

.enemy {
    width: 30px;
    height: 30px;

    background: red;

    position: absolute;
}

button {
    padding: 12px 22px;

    margin: 5px;

    border: none;

    border-radius: 10px;

    font-size: 17px;

    cursor: pointer;
}

#start {
    background: white;
    color: black;
}

#home {
    background: #444;
    color: white;
}

#gameOver {
    display: none;

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: rgba(0,0,0,0.9);

    padding: 30px;

    border-radius: 15px;

    z-index: 10;
}

</style>
</head>

<body>

<h1>🪙 Coin Dodge</h1>

<div id="info">
    Punkte: 0 | Leben: ❤️❤️❤️
</div>

<div id="cooldown"></div>

<button id="start" onclick="startGame()">
    ▶️ Start
</button>

<button id="home" onclick="location.href='../'">
    🏠 Startseite
</button>

<div id="game">

    <div id="player"></div>

    <div id="coin"></div>

    <div id="gameOver">

        <h2>💀 GAME OVER</h2>

        <p id="finalScore"></p>

        <button onclick="startGame()">
            🔄 Nochmal spielen
        </button>

    </div>

</div>

<script>

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const coin =
    document.getElementById("coin");

const info =
    document.getElementById("info");

const cooldownText =
    document.getElementById("cooldown");

const gameOverScreen =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");


let playerX = 335;
let playerY = 210;

let score = 0;

let lives = 3;

let gameRunning = false;

let invincible = false;

let keys = {};

let enemies = [];

let blinkInterval;


/* Tastatur */

document.addEventListener("keydown", function(event) {

    keys[event.key.toLowerCase()] = true;

});


document.addEventListener("keyup", function(event) {

    keys[event.key.toLowerCase()] = false;

});


/* Zufällige Position */

function randomPosition(size) {

    return {

        x: Math.random() *
            (game.clientWidth - size),

        y: Math.random() *
            (game.clientHeight - size)

    };

}


/* Coin bewegen */

function moveCoin() {

    let position =
        randomPosition(22);

    coin.style.left =
        position.x + "px";

    coin.style.top =
        position.y + "px";

}


/* Gegner erstellen */

function createEnemies() {

    enemies.forEach(enemy => {

        enemy.element.remove();

    });

    enemies = [];


    for (let i = 0; i < 3; i++) {

        let enemy =
            document.createElement("div");

        enemy.className =
            "enemy";


        let position =
            randomPosition(30);


        enemy.style.left =
            position.x + "px";

        enemy.style.top =
            position.y + "px";


        game.appendChild(enemy);


        enemies.push({

            element: enemy,

            x: position.x,

            y: position.y,

            dx: Math.random() < 0.5 ? 2 : -2,

            dy: Math.random() < 0.5 ? 2 : -2

        });

    }

}


/* Spiel starten */

function startGame() {

    score = 0;

    lives = 3;

    gameRunning = true;

    invincible = false;


    playerX = 335;

    playerY = 210;


    gameOverScreen.style.display =
        "none";


    cooldownText.textContent =
        "";


    player.style.display =
        "block";


    player.style.opacity =
        "1";


    updateInfo();

    moveCoin();

    createEnemies();

}


/* Spieler bewegen */

function movePlayer() {

    if (!gameRunning) {
        return;
    }


    const speed = 4;


    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        playerY -= speed;

    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        playerY += speed;

    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        playerX -= speed;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        playerX += speed;

    }


    /* Grenzen */

    playerX =
        Math.max(
            0,
            Math.min(
                game.clientWidth - 30,
                playerX
            )
        );


    playerY =
        Math.max(
            0,
            Math.min(
                game.clientHeight - 30,
                playerY
            )
        );


    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* Gegner bewegen */

function moveEnemies() {

    if (!gameRunning) {
        return;
    }


    enemies.forEach(enemy => {

        enemy.x += enemy.dx;

        enemy.y += enemy.dy;


        if (
            enemy.x <= 0 ||
            enemy.x >=
            game.clientWidth - 30
        ) {

            enemy.dx *= -1;

        }


        if (
            enemy.y <= 0 ||
            enemy.y >=
            game.clientHeight - 30
        ) {

            enemy.dy *= -1;

        }


        enemy.element.style.left =
            enemy.x + "px";

        enemy.element.style.top =
            enemy.y + "px";

    });

}


/* Kollision prüfen */

function collision(
    ax,
    ay,
    aw,
    ah,
    bx,
    by,
    bw,
    bh
) {

    return (

        ax < bx + bw &&

        ax + aw > bx &&

        ay < by + bh &&

        ay + ah > by

    );

}


/* Coin prüfen */

function checkCoin() {

    let coinX =
        parseFloat(coin.style.left);

    let coinY =
        parseFloat(coin.style.top);


    if (

        collision(

            playerX,
            playerY,
            30,
            30,

            coinX,
            coinY,
            22,
            22

        )

    ) {

        score += 10;

        moveCoin();

        updateInfo();

    }

}


/* Gegner prüfen */

function checkEnemies() {

    if (invincible) {
        return;
    }


    for (let enemy of enemies) {

        if (

            collision(

                playerX,
                playerY,
                30,
                30,

                enemy.x,
                enemy.y,
                30,
                30

            )

        ) {

            loseLife();

            break;

        }

    }

}


/* Leben verlieren */

function loseLife() {

    if (invincible) {
        return;
    }


    lives--;

    updateInfo();


    if (lives <= 0) {

        endGame();

        return;

    }


    /*
    🛡️ COOLDOWN
    */

    invincible = true;


    let timeLeft = 1.0;


    cooldownText.textContent =
        "🛡️ Unverwundbar: 1.0 s";


    /* Spieler blinken */

    blinkInterval =
        setInterval(function() {

            if (
                player.style.opacity === "0"
            ) {

                player.style.opacity = "1";

            } else {

                player.style.opacity = "0";

            }

        }, 100);


    /* Countdown */

    let countdown =
        setInterval(function() {

            timeLeft -= 0.1;


            if (timeLeft <= 0) {

                clearInterval(countdown);

                clearInterval(blinkInterval);


                player.style.opacity =
                    "1";


                invincible = false;


                cooldownText.textContent =
                    "";

            } else {

                cooldownText.textContent =
                    "🛡️ Unverwundbar: " +
                    timeLeft.toFixed(1) +
                    " s";

            }

        }, 100);

}


/* Anzeige */

function updateInfo() {

    info.textContent =
        "Punkte: " +
        score +
        " | Leben: " +
        "❤️".repeat(lives);

}


/* Game Over */

function endGame() {

    gameRunning = false;

    invincible = false;


    clearInterval(blinkInterval);


    player.style.opacity =
        "1";


    player.style.display =
        "none";


    cooldownText.textContent =
        "";


    finalScore.textContent =
        "Du hast " +
        score +
        " Punkte erreicht!";


    gameOverScreen.style.display =
        "block";

}


/* Hauptschleife */

function gameLoop() {

    movePlayer();

    moveEnemies();

    checkCoin();

    checkEnemies();


    requestAnimationFrame(
        gameLoop
    );

}


/* Startzustand */

player.style.display =
    "none";

coin.style.display =
    "block";


/* Spielschleife starten */

gameLoop();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Dodge</title>

    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin: 15px 0 5px;
        }

        #score {
            font-size: 20px;
            margin-bottom: 10px;
        }

        canvas {
            background: #222;
            border: 2px solid white;
            max-width: 95vw;
            max-height: 65vh;
        }

        #controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: 60px 60px 60px;
            justify-content: center;
            gap: 5px;
        }

        button {
            width: 60px;
            height: 60px;
            font-size: 25px;
            border: none;
            border-radius: 12px;
            background: #444;
            color: white;
        }

        button:active {
            background: #777;
        }

        #restart {
            margin-top: 15px;
            width: 130px;
            height: 45px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>🪙 Coin Dodge</h1>
<div id="score">Punkte: 0 | Leben: ❤️❤️❤️</div>

<canvas id="game" width="600" height="400"></canvas>

<div id="controls">
    <div></div>
    <button id="up">⬆️</button>
    <div></div>

    <button id="left">⬅️</button>
    <button id="down">⬇️</button>
    <button id="right">➡️</button>
</div>

<button id="restart">🔄 Neustart</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player;
let coins;
let enemies;
let score;
let lives;
let gameOver;
let enemySpeed;

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function randomPosition(size) {
    return {
        x: Math.random() * (canvas.width - size),
        y: Math.random() * (canvas.height - size)
    };
}

function createGame() {
    player = {
        x: 280,
        y: 180,
        size: 25,
        speed: 4
    };

    coins = [];

    for (let i = 0; i < 5; i++) {
        const pos = randomPosition(15);
        coins.push({
            x: pos.x,
            y: pos.y,
            size: 15
        });
    }

    enemies = [];

    for (let i = 0; i < 3; i++) {
        const pos = randomPosition(25);

        enemies.push({
            x: pos.x,
            y: pos.y,
            size: 25,
            dx: Math.random() > 0.5 ? 1 : -1,
            dy: Math.random() > 0.5 ? 1 : -1
        });
    }

    score = 0;
    lives = 3;
    enemySpeed = 2;
    gameOver = false;

    updateScore();
}

function updateScore() {
    let hearts = "❤️".repeat(lives);
    document.getElementById("score").textContent =
        `Punkte: ${score} | Leben: ${hearts}`;
}

function movePlayer() {
    if (keys["arrowup"] || keys["w"]) {
        player.y -= player.speed;
    }

    if (keys["arrowdown"] || keys["s"]) {
        player.y += player.speed;
    }

    if (keys["arrowleft"] || keys["a"]) {
        player.x -= player.speed;
    }

    if (keys["arrowright"] || keys["d"]) {
        player.x += player.speed;
    }

    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));
}

function moveEnemies() {
    enemies.forEach(enemy => {
        enemy.x += enemy.dx * enemySpeed;
        enemy.y += enemy.dy * enemySpeed;

        if (enemy.x <= 0 || enemy.x + enemy.size >= canvas.width) {
            enemy.dx *= -1;
        }

        if (enemy.y <= 0 || enemy.y + enemy.size >= canvas.height) {
            enemy.dy *= -1;
        }
    });
}

function collision(a, b) {
    return (
        a.x < b.x + b.size &&
        a.x + a.size > b.x &&
        a.y < b.y + b.size &&
        a.y + a.size > b.y
    );
}

function checkCoins() {
    coins.forEach((coin, index) => {
        if (collision(player, coin)) {
            coins.splice(index, 1);

            score += 10;

            const pos = randomPosition(15);

            coins.push({
                x: pos.x,
                y: pos.y,
                size: 15
            });

            if (score % 50 === 0) {
                enemySpeed += 0.5;
            }

            updateScore();
        }
    });
}

function checkEnemies() {
    enemies.forEach(enemy => {
        if (collision(player, enemy)) {
            lives--;

            player.x = 280;
            player.y = 180;

            updateScore();

            if (lives <= 0) {
                gameOver = true;
            }
        }
    });
}

function drawPlayer() {
    ctx.fillStyle = "#3498db";
    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );
}

function drawCoins() {
    coins.forEach(coin => {
        ctx.fillStyle = "gold";

        ctx.beginPath();
        ctx.arc(
            coin.x + coin.size / 2,
            coin.y + coin.size / 2,
            coin.size / 2,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });
}

function drawEnemies() {
    enemies.forEach(enemy => {
        ctx.fillStyle = "red";

        ctx.fillRect(
            enemy.x,
            enemy.y,
            enemy.size,
            enemy.size
        );
    });
}

function drawGameOver() {
    if (!gameOver) return;

    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";
    ctx.textAlign = "center";

    ctx.font = "40px Arial";
    ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        canvas.height / 2 - 20
    );

    ctx.font = "25px Arial";
    ctx.fillText(
        `Punkte: ${score}`,
        canvas.width / 2,
        canvas.height / 2 + 30
    );
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        movePlayer();
        moveEnemies();
        checkCoins();
        checkEnemies();
    }

    drawCoins();
    drawEnemies();
    drawPlayer();
    drawGameOver();

    requestAnimationFrame(gameLoop);
}

function setupButton(id, key) {
    const button = document.getElementById(id);

    button.addEventListener("touchstart", e => {
        e.preventDefault();
        keys[key] = true;
    });

    button.addEventListener("touchend", e => {
        e.preventDefault();
        keys[key] = false;
    });

    button.addEventListener("mousedown", () => {
        keys[key] = true;
    });

    button.addEventListener("mouseup", () => {
        keys[key] = false;
    });

    button.addEventListener("mouseleave", () => {
        keys[key] = false;
    });
}

setupButton("up", "arrowup");
setupButton("down", "arrowdown");
setupButton("left", "arrowleft");
setupButton("right", "arrowright");

document.getElementById("restart").addEventListener("click", createGame);

createGame();
gameLoop();
</script>

</body>
</html>

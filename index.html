<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🪙 Coin Dodge</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px;
}

#info {
    font-size: 22px;
    margin: 10px;
}

#shield {
    height: 25px;
    font-size: 18px;
}

#game {
    width: 90vw;
    max-width: 700px;
    height: 450px;

    margin: 15px auto;

    background: #222;

    border: 3px solid white;

    position: relative;

    overflow: hidden;
}

#player {
    width: 30px;
    height: 30px;

    background: #3498db;

    position: absolute;

    left: 335px;
    top: 210px;

    border-radius: 5px;

    z-index: 5;
}

.coin {
    width: 22px;
    height: 22px;

    background: gold;

    border-radius: 50%;

    position: absolute;

    box-shadow: 0 0 8px gold;
}

.enemy {
    width: 30px;
    height: 30px;

    background: red;

    position: absolute;

    border-radius: 5px;

    z-index: 3;
}

button {
    padding: 12px 22px;

    margin: 5px;

    border: none;

    border-radius: 10px;

    font-size: 17px;

    cursor: pointer;
}

#start {
    background: white;
    color: black;
}

#gameOver {
    display: none;

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: rgba(0,0,0,0.95);

    padding: 30px;

    border-radius: 15px;

    z-index: 20;

    width: 250px;
}

</style>
</head>

<body>

<h1>🪙 Coin Dodge</h1>

<div id="info">
Punkte: 0 | Leben: ❤️❤️❤️
</div>

<div id="shield"></div>

<button id="start" onclick="startGame()">
▶️ Start
</button>

<div id="game">

    <div id="player"></div>

    <!-- 10 Coins werden hier erzeugt -->

    <div id="gameOver">

        <h2>💀 GAME OVER</h2>

        <p id="finalScore"></p>

        <button onclick="startGame()">
            🔄 Nochmal
        </button>

    </div>

</div>


<script>

/* =========================
   ELEMENTE
========================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const info =
    document.getElementById("info");

const shield =
    document.getElementById("shield");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");


/* =========================
   VARIABLEN
========================= */

let playerX = 335;
let playerY = 210;

let score = 0;

let lives = 3;

let gameRunning = false;

let invincible = false;

let keys = {};

let enemies = [];

let coins = [];

let cooldownTimer = null;

let blinkTimer = null;


/* =========================
   TASTATUR
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;

    }
);

document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);


/* =========================
   ZUFÄLLIGE POSITION
========================= */

function randomPosition(size) {

    return {

        x:
            Math.random() *
            (game.clientWidth - size),

        y:
            Math.random() *
            (game.clientHeight - size)

    };

}


/* =========================
   10 COINS ERSTELLEN
========================= */

function createCoins() {

    /*
       Alte Coins löschen
    */

    coins.forEach(function(coin) {

        coin.element.remove();

    });


    coins = [];


    /*
       10 neue Coins
    */

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        let coin =
            document.createElement("div");

        coin.className =
            "coin";


        let position =
            randomPosition(22);


        coin.style.left =
            position.x + "px";

        coin.style.top =
            position.y + "px";


        game.appendChild(coin);


        coins.push({

            element: coin,

            x: position.x,

            y: position.y,

            collected: false

        });

    }

}


/* =========================
   NEUE COIN POSITION
========================= */

function respawnCoin(coin) {

    let position =
        randomPosition(22);


    coin.x =
        position.x;

    coin.y =
        position.y;


    coin.collected =
        false;


    coin.element.style.left =
        coin.x + "px";

    coin.element.style.top =
        coin.y + "px";

    coin.element.style.display =
        "block";

}


/* =========================
   GEGNER ERSTELLEN
========================= */

function createEnemies() {

    enemies.forEach(function(enemy) {

        enemy.element.remove();

    });


    enemies = [];


    /*
       3 Gegner
    */

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        let enemy =
            document.createElement("div");

        enemy.className =
            "enemy";


        let position =
            randomPosition(30);


        enemy.style.left =
            position.x + "px";

        enemy.style.top =
            position.y + "px";


        game.appendChild(enemy);


        enemies.push({

            element: enemy,

            x: position.x,

            y: position.y,

            dx:
                Math.random() < 0.5
                ? 2
                : -2,

            dy:
                Math.random() < 0.5
                ? 2
                : -2

        });

    }

}


/* =========================
   SPIEL STARTEN
========================= */

function startGame() {

    clearTimeout(cooldownTimer);

    clearInterval(blinkTimer);


    score = 0;

    lives = 3;

    gameRunning = true;

    invincible = false;


    playerX = 335;

    playerY = 210;


    player.style.display =
        "block";

    player.style.opacity =
        "1";


    gameOver.style.display =
        "none";


    shield.textContent =
        "";


    updateInfo();


    /*
       10 Coins
    */

    createCoins();


    /*
       Gegner
    */

    createEnemies();


    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =========================
   SPIELER BEWEGEN
========================= */

function movePlayer() {

    if (!gameRunning) {
        return;
    }


    const speed = 4;


    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        playerY -= speed;

    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        playerY += speed;

    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        playerX -= speed;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        playerX += speed;

    }


    /*
       Spielfeldgrenzen
    */

    playerX =
        Math.max(
            0,
            Math.min(
                game.clientWidth - 30,
                playerX
            )
        );


    playerY =
        Math.max(
            0,
            Math.min(
                game.clientHeight - 30,
                playerY
            )
        );


    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =========================
   GEGNER BEWEGEN
========================= */

function moveEnemies() {

    if (!gameRunning) {
        return;
    }


    enemies.forEach(function(enemy) {

        enemy.x += enemy.dx;

        enemy.y += enemy.dy;


        if (
            enemy.x <= 0 ||
            enemy.x >=
            game.clientWidth - 30
        ) {

            enemy.dx *= -1;

        }


        if (
            enemy.y <= 0 ||
            enemy.y >=
            game.clientHeight - 30
        ) {

            enemy.dy *= -1;

        }


        enemy.element.style.left =
            enemy.x + "px";

        enemy.element.style.top =
            enemy.y + "px";

    });

}


/* =========================
   KOLLISION
========================= */

function collision(
    ax,
    ay,
    aw,
    ah,
    bx,
    by,
    bw,
    bh
) {

    return (

        ax < bx + bw &&

        ax + aw > bx &&

        ay < by + bh &&

        ay + ah > by

    );

}


/* =========================
   COINS PRÜFEN
========================= */

function checkCoins() {

    coins.forEach(function(coin) {

        if (coin.collected) {
            return;
        }


        if (

            collision(

                playerX,
                playerY,
                30,
                30,

                coin.x,
                coin.y,
                22,
                22

            )

        ) {

            /*
               Coin einsammeln
            */

            score += 10;


            /*
               Coin sofort
               an anderer Stelle
               erscheinen lassen
            */

            respawnCoin(coin);


            updateInfo();

        }

    });

}


/* =========================
   GEGNER PRÜFEN
========================= */

function checkEnemies() {

    /*
       Während Cooldown:
       KEIN Schaden möglich
    */

    if (invincible) {

        return;

    }


    for (
        let enemy of enemies
    ) {

        if (

            collision(

                playerX,
                playerY,
                30,
                30,

                enemy.x,
                enemy.y,
                30,
                30

            )

        ) {

            loseLife();

            return;

        }

    }

}


/* =========================
   LEBEN VERLIEREN
========================= */

function loseLife() {

    if (invincible) {
        return;
    }


    lives--;


    updateInfo();


    /*
       Game Over
    */

    if (lives <= 0) {

        endGame();

        return;

    }


    /*
       🛡️ COOLDOWN START
    */

    invincible = true;


    shield.textContent =
        "🛡️ UNVERWUNDBAR";


    /*
       Spieler blinken
    */

    blinkTimer =
        setInterval(function() {

            if (
                player.style.opacity === "1"
            ) {

                player.style.opacity =
                    "0.25";

            } else {

                player.style.opacity =
                    "1";

            }

        }, 100);


    /*
       Spieler weg vom Gegner
    */

    movePlayerToSafePosition();


    /*
       1,5 Sekunden Cooldown
    */

    cooldownTimer =
        setTimeout(function() {

            invincible = false;


            clearInterval(
                blinkTimer
            );


            player.style.opacity =
                "1";


            shield.textContent =
                "";

        }, 1500);

}


/* =========================
   SICHERE POSITION
========================= */

function movePlayerToSafePosition() {

    let position;

    let safe = false;


    while (!safe) {

        position =
            randomPosition(30);

        safe = true;


        for (
            let enemy of enemies
        ) {

            if (

                collision(

                    position.x,
                    position.y,
                    30,
                    30,

                    enemy.x,
                    enemy.y,
                    30,
                    30

                )

            ) {

                safe = false;

                break;

            }

        }

    }


    playerX =
        position.x;

    playerY =
        position.y;


    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =========================
   ANZEIGE
========================= */

function updateInfo() {

    info.textContent =
        "Punkte: " +
        score +
        " | Leben: " +
        "❤️".repeat(lives);

}


/* =========================
   GAME OVER
========================= */

function endGame() {

    gameRunning = false;

    invincible = false;


    clearTimeout(
        cooldownTimer
    );

    clearInterval(
        blinkTimer
    );


    player.style.opacity =
        "1";

    player.style.display =
        "none";


    shield.textContent =
        "";


    finalScore.textContent =
        "Du hast " +
        score +
        " Punkte erreicht!";


    gameOver.style.display =
        "block";

}


/* =========================
   HAUPTSCHLEIFE
========================= */

function gameLoop() {

    movePlayer();

    moveEnemies();

    checkCoins();

    checkEnemies();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   STARTZUSTAND
========================= */

player.style.display =
    "none";


gameLoop();

</script>

</body>
</html>

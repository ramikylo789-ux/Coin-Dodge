<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Dodge</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px;
}

#info {
    font-size: 22px;
    margin: 10px;
}

#shield {
    height: 25px;
    font-size: 18px;
}

#game {
    width: 700px;
    max-width: 90vw;
    height: 450px;
    margin: 15px auto;
    background: #222;
    border: 3px solid white;
    position: relative;
    overflow: hidden;
}

#player {
    width: 30px;
    height: 30px;
    background: #3498db;
    position: absolute;
    border-radius: 5px;
}

.coin {
    width: 22px;
    height: 22px;
    background: gold;
    border-radius: 50%;
    position: absolute;
}

.enemy {
    width: 30px;
    height: 30px;
    background: red;
    position: absolute;
    border-radius: 5px;
}

button {
    padding: 12px 25px;
    margin: 5px;
    font-size: 18px;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
}

#start {
    background: white;
}

#gameOver {
    display: none;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: #000;
    padding: 30px;
    border-radius: 15px;
    z-index: 100;
}
</style>
</head>

<body>

<h1>🪙 Coin Dodge</h1>

<div id="info">
Punkte: 0 | Leben: ❤️❤️❤️
</div>

<div id="shield"></div>

<button id="start">▶️ Start</button>

<div id="game">

    <div id="player"></div>

    <div id="gameOver">
        <h2>💀 GAME OVER</h2>
        <p id="finalScore"></p>
        <button onclick="startGame()">🔄 Nochmal</button>
    </div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const info = document.getElementById("info");
const shield = document.getElementById("shield");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const startButton = document.getElementById("start");

let x = 335;
let y = 210;

let score = 0;
let lives = 3;

let running = false;

/* Cooldown */
let invincible = false;

let keys = {};

let coins = [];
let enemies = [];

let cooldownTimer;


/* =========================
   TASTEN
========================= */

document.addEventListener("keydown", function(e) {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", function(e) {
    keys[e.key.toLowerCase()] = false;
});


/* =========================
   START
========================= */

startButton.onclick = startGame;


function startGame() {

    running = true;

    score = 0;
    lives = 3;

    invincible = false;

    x = 335;
    y = 210;

    player.style.display = "block";
    player.style.opacity = "1";

    gameOver.style.display = "none";

    shield.innerHTML = "";

    clearTimeout(cooldownTimer);

    createCoins();
    createEnemies();

    updateInfo();
}


/* =========================
   COINS
========================= */

function createCoins() {

    /* Alte Coins entfernen */

    coins.forEach(function(c) {
        c.remove();
    });

    coins = [];


    /* 10 Coins */

    for (let i = 0; i < 10; i++) {

        let coin = document.createElement("div");

        coin.className = "coin";

        game.appendChild(coin);

        coins.push(coin);

        moveCoin(coin);
    }
}


function moveCoin(coin) {

    let newX =
        Math.random() * (game.clientWidth - 22);

    let newY =
        Math.random() * (game.clientHeight - 22);

    coin.style.left = newX + "px";
    coin.style.top = newY + "px";
}


/* =========================
   GEGNER
========================= */

function createEnemies() {

    enemies.forEach(function(e) {
        e.element.remove();
    });

    enemies = [];


    for (let i = 0; i < 3; i++) {

        let element =
            document.createElement("div");

        element.className = "enemy";

        game.appendChild(element);


        let enemy = {

            element: element,

            x: Math.random() *
                (game.clientWidth - 30),

            y: Math.random() *
                (game.clientHeight - 30),

            dx:
                Math.random() > 0.5
                ? 2
                : -2,

            dy:
                Math.random() > 0.5
                ? 2
                : -2

        };


        enemies.push(enemy);
    }
}


/* =========================
   SPIELER
========================= */

function movePlayer() {

    if (!running) return;

    let speed = 4;


    if (keys["w"] || keys["arrowup"]) {
        y -= speed;
    }

    if (keys["s"] || keys["arrowdown"]) {
        y += speed;
    }

    if (keys["a"] || keys["arrowleft"]) {
        x -= speed;
    }

    if (keys["d"] || keys["arrowright"]) {
        x += speed;
    }


    /* Grenzen */

    x = Math.max(
        0,
        Math.min(
            game.clientWidth - 30,
            x
        )
    );

    y = Math.max(
        0,
        Math.min(
            game.clientHeight - 30,
            y
        )
    );


    player.style.left = x + "px";
    player.style.top = y + "px";
}


/* =========================
   GEGNER BEWEGEN
========================= */

function moveEnemies() {

    if (!running) return;


    enemies.forEach(function(enemy) {

        enemy.x += enemy.dx;
        enemy.y += enemy.dy;


        if (
            enemy.x <= 0 ||
            enemy.x >= game.clientWidth - 30
        ) {
            enemy.dx *= -1;
        }


        if (
            enemy.y <= 0 ||
            enemy.y >= game.clientHeight - 30
        ) {
            enemy.dy *= -1;
        }


        enemy.element.style.left =
            enemy.x + "px";

        enemy.element.style.top =
            enemy.y + "px";
    });
}


/* =========================
   KOLLISION
========================= */

function hit(
    ax, ay, aw, ah,
    bx, by, bw, bh
) {

    return (
        ax < bx + bw &&
        ax + aw > bx &&
        ay < by + bh &&
        ay + ah > by
    );
}


/* =========================
   COINS EINSAMMELN
========================= */

function checkCoins() {

    if (!running) return;


    coins.forEach(function(coin) {

        let cx =
            parseFloat(coin.style.left);

        let cy =
            parseFloat(coin.style.top);


        if (
            hit(
                x, y, 30, 30,
                cx, cy, 22, 22
            )
        ) {

            score += 10;

            moveCoin(coin);

            updateInfo();
        }
    });
}


/* =========================
   GEGNER KOLLISION
========================= */

function checkEnemies() {

    if (!running) return;

    /* Während Cooldown nichts machen */

    if (invincible) return;


    for (let enemy of enemies) {

        if (
            hit(
                x, y, 30, 30,
                enemy.x, enemy.y, 30, 30
            )
        ) {

            loseLife();

            return;
        }
    }
}


/* =========================
   LEBEN VERLIEREN
========================= */

function loseLife() {

    /* Sicherheit */

    if (invincible) return;


    lives--;

    updateInfo();


    /* Game Over */

    if (lives <= 0) {

        endGame();

        return;
    }


    /* =====================
       COOLDOWN START
    ===================== */

    invincible = true;

    shield.innerHTML =
        "🛡️ UNVERWUNDBAR";


    /*
       Spieler sichtbar blinken
    */

    let blink = true;

    let blinkTimer =
        setInterval(function() {

            player.style.opacity =
                blink ? "0.2" : "1";

            blink = !blink;

        }, 100);


    /*
       Spieler in die Mitte setzen
    */

    x =
        game.clientWidth / 2 - 15;

    y =
        game.clientHeight / 2 - 15;


    player.style.left = x + "px";
    player.style.top = y + "px";


    /*
       Nach 1,5 Sekunden
       wieder verwundbar
    */

    cooldownTimer =
        setTimeout(function() {

            invincible = false;

            clearInterval(blinkTimer);

            player.style.opacity = "1";

            shield.innerHTML = "";

        }, 1500);
}


/* =========================
   ANZEIGE
========================= */

function updateInfo() {

    info.innerHTML =
        "Punkte: " +
        score +
        " | Leben: " +
        "❤️".repeat(lives);
}


/* =========================
   GAME OVER
========================= */

function endGame() {

    running = false;

    invincible = false;

    clearTimeout(cooldownTimer);

    player.style.display = "none";

    shield.innerHTML = "";

    finalScore.innerHTML =
        "Punkte: " + score;

    gameOver.style.display = "block";
}


/* =========================
   HAUPTSCHLEIFE
========================= */

function loop() {

    movePlayer();

    moveEnemies();

    checkCoins();

    checkEnemies();

    requestAnimationFrame(loop);
}


/* =========================
   VOR START
========================= */

player.style.display = "none";


/* Spielschleife */

loop();

</script>

</body>
</html>
